model_list:
  # --- Local Ollama (host-served via http://host.docker.internal:11434) ---
  #
  # Named aliases below exist for backward compatibility with existing agent manifests.
  # You do NOT need to add an entry for every Ollama model — LiteLLM automatically
  # routes any model prefixed with "ollama/" to the OLLAMA_API_BASE endpoint set in
  # the environment.  E.g. an agent with model "ollama/llama3.2:latest" will work
  # without any config change here as long as that model is pulled in Ollama.
  #
  - model_name: local-chat
    litellm_params:
      model: os.environ/OLLAMA_CHAT_MODEL
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: local-embedding
    litellm_params:
      model: os.environ/OLLAMA_EMBEDDING_MODEL
      api_base: os.environ/OLLAMA_API_BASE

  # Legacy alias used by tests/manifests during development.
  - model_name: mock-model
    litellm_params:
      model: os.environ/OLLAMA_CHAT_MODEL
      api_base: os.environ/OLLAMA_API_BASE

  # --- Explicit Ollama model entries ---
  # With master_key set, LiteLLM validates all model names against this list.
  # Add every Ollama model that agents should be allowed to use.
  - model_name: ollama/gemma4:latest
    litellm_params:
      model: ollama/gemma4:latest
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: ollama/gemma4-e2b:latest
    litellm_params:
      model: ollama/gemma4-e2b:latest
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: ollama/qwen3:latest
    litellm_params:
      model: ollama/qwen3:latest
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: ollama/qwen3-8b:latest
    litellm_params:
      model: ollama/qwen3-8b:latest
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: ollama/qwen2.5-q6k:latest
    litellm_params:
      model: ollama/qwen2.5-q6k:latest
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: mock-gpt-4o
    litellm_params:
      model: os.environ/OLLAMA_CHAT_MODEL
      api_base: os.environ/OLLAMA_API_BASE

  # --- Anthropic / Claude ---
  # api_base is optional: leave unset to use api.anthropic.com directly,
  # or set ANTHROPIC_BASE_URL in infra/local/.env to route through a corporate
  # proxy / Bedrock gateway (e.g. https://llm-inference.internal.example.com/).
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  - model_name: claude-opus-4-5
    litellm_params:
      model: anthropic/claude-opus-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  - model_name: claude-3-7-sonnet-20250219
    litellm_params:
      model: anthropic/claude-3-7-sonnet-20250219
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  - model_name: claude-3-5-haiku-20241022
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  # Short aliases used in agent manifests
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  # Compatibility aliases — map old/fictional model names that may be cached
  # in agent manifests or browser localStorage to real deployed models.
  # These never appear in the UI model selector (not db_model) but silently
  # rescue requests that would otherwise 404 at the Anthropic API.
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL

  # --- OpenAI ---
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # --- Embeddings (required by activities_memory.py) ---
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
  # Corporate networks with SSL inspection present a self-signed cert that the
  # LiteLLM container (Alpine-based) cannot verify — disable peer verification.
  # When ANTHROPIC_BASE_URL points to an internal proxy this is a non-issue anyway.
  ssl_verify: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
