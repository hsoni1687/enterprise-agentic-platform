services:
  # ------------------------------------
  # Orchestration: Temporal Cluster
  # ------------------------------------
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal
    entrypoint: ["/usr/local/bin/temporal", "server", "start-dev", "--db-filename", "/var/lib/temporal/temporal.db", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - ./temporal_data:/var/lib/temporal
    networks:
      - agent-net

  # ------------------------------------
  # Datastores: Postgres & Redis
  # ------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agentplatform
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentplatform"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - agent-net

  # ------------------------------------
  # Schema Migrations (runs on every up, exits when done)
  # Uses a _migration_history table to track applied files.
  # Only runs NEW migration files — never re-runs applied ones.
  # Fails loudly if an applied file is modified (edit-after-apply protection).
  # ------------------------------------
  migrate:
    image: pgvector/pgvector:pg16
    # No container_name — lets Docker Compose create a fresh container on every
    # `docker compose up`, guaranteeing the current migrate.sh is always executed.
    # A fixed container_name causes Docker to reuse the exited container and skip
    # the run entirely when condition: service_completed_successfully is cached.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../postgres/migrations:/migrations:ro
      - ../postgres/migrate.sh:/migrate.sh:ro
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
    entrypoint: ["bash", "/migrate.sh", "/migrations"]
    networks:
      - agent-net

  # ------------------------------------
  # LiteLLM Proxy  (port 4000)
  # Replaces the custom llm-gateway service.
  # All platform services route inference through here.
  # ------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-ollama/qwen8b:latest}
      - OLLAMA_QWEN_MODEL=${OLLAMA_QWEN_MODEL:-ollama/qwen8b:latest}
      - OLLAMA_GEMMA_MODEL=${OLLAMA_GEMMA_MODEL:-ollama/gemma4:latest}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-ollama/nomic-embed-text}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/litellm
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; req=urllib.request.Request('http://localhost:4000/health', headers={'Authorization': 'Bearer ' + os.environ.get('LITELLM_MASTER_KEY', 'sk-litellm-dev')}); urllib.request.urlopen(req, timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - agent-net

  # ------------------------------------
  # Tier-1: Tool Registry  (port 8086)
  # ------------------------------------
  tool-registry:
    build:
      context: ../../
      dockerfile: services/tool-registry/Dockerfile
    container_name: tool-registry
    ports:
      - "8086:8086"
    environment:
      # Remove DATABASE_URL to fall back to in-memory store.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-net

  # ------------------------------------
  # Tier-2: Skill Catalog  (port 8087)
  # ------------------------------------
  skill-catalog:
    build:
      context: ../../
      dockerfile: services/skill-catalog/Dockerfile
    container_name: skill-catalog
    ports:
      - "8087:8087"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-net

  # ------------------------------------
  # Tier-2: Skill Dispatcher  (port 8085)
  # ------------------------------------
  skill-dispatcher:
    build:
      context: ../../
      dockerfile: services/skill-dispatcher/Dockerfile
    container_name: skill-dispatcher
    ports:
      - "8085:8085"
    environment:
      - WORKFLOW_INITIATOR_URL=http://workflow-initiator:8081
      - BASH_EXECUTOR_URL=http://bash-executor:8092
      - SANDBOX_MANAGER_URL=http://sandbox-manager:8082
      - KG_SERVICE_URL=http://kg-service:8093
      - SKILL_CATALOG_URL=http://skill-catalog:8087
    depends_on:
      - skill-catalog
      - bash-executor
      - sandbox-manager
      - kg-service
    networks:
      - agent-net

  # ------------------------------------
  # Tier-3: Sub-Agent Registry  (port 8084)
  # ------------------------------------
  sub-agent-registry:
    build:
      context: ../../
      dockerfile: services/sub-agent-registry/Dockerfile
    container_name: sub-agent-registry
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-net

  # ------------------------------------
  # Tier-4: Agent Registry  (port 8088)
  # ------------------------------------
  agent-registry:
    build:
      context: ../../
      dockerfile: services/agent-registry/Dockerfile
    container_name: agent-registry
    ports:
      - "8088:8088"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-net

  # ------------------------------------
  # API Gateway  (port 8080)
  # ------------------------------------
  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - WORKFLOW_INITIATOR_URL=http://workflow-initiator:8081
    depends_on:
      - workflow-initiator
    networks:
      - agent-net

  # ------------------------------------
  # Workflow Initiator  (port 8081)
  # ------------------------------------
  workflow-initiator:
    build:
      context: ../../
      dockerfile: services/workflow-initiator/Dockerfile
    container_name: workflow-initiator
    ports:
      - "8081:8081"
    environment:
      - TEMPORAL_HOSTPORT=temporal:7233
      - AGENT_REGISTRY_URL=http://agent-registry:8088
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=sk-litellm-dev
      - SKILL_CATALOG_URL=http://skill-catalog:8087
    depends_on:
      - temporal
      - agent-registry
    networks:
      - agent-net

  # ------------------------------------
  # Sandbox Manager  (port 8082)
  # ------------------------------------
  sandbox-manager:
    build:
      context: ../../
      dockerfile: services/sandbox-manager/Dockerfile
    container_name: sandbox-manager
    ports:
      - "8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LLM_GATEWAY_URL=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
      - LLM_SUMMARY_MODEL=local-chat
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - agent-net

  # ------------------------------------
  # Bash Executor  (port 8092)
  # ------------------------------------
  bash-executor:
    build:
      context: ../../
      dockerfile: services/bash-executor/Dockerfile
    container_name: bash-executor
    ports:
      - "8092:8092"
    environment:
      - PORT=8092
      - MAX_MEMORY_MB=512
      - MAX_CPU_CORES=2
      - MAX_TIMEOUT_SECONDS=3600
      - MAX_OUTPUT_BYTES=67108864
    networks:
      - agent-net

  # ------------------------------------
  # KG Service (port 8093)
  # ------------------------------------
  kg-service:
    build:
      context: ../../
      dockerfile: services/kg-service/Dockerfile
    container_name: kg-service
    ports:
      - "8093:8093"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
      - LLM_GATEWAY_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
      - EMBEDDING_MODEL=local-embedding
      - EMBEDDING_DIMENSIONS=1536
      - KG_EXTRACTION_MODEL=${KG_EXTRACTION_MODEL:-ollama/gemma4:latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-net

  # ------------------------------------
  # Agent Workers (Temporal Python)
  # ------------------------------------
  agent-workers:
    build:
      context: ../../
      dockerfile: services/agent-workers/Dockerfile
    container_name: agent-workers
    restart: on-failure
    ports:
      - "8094:8094"   # Tool API (playground + agent direct invocation)
    environment:
      - TEMPORAL_HOSTPORT=temporal:7233
      - LLM_GATEWAY_URL=http://litellm:4000/v1
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
      - MCP_REGISTRY_URL=http://mcp-registry:8090
      - KG_SERVICE_URL=http://kg-service:8093
      - EMBEDDING_MODEL=local-embedding
      - TEMPORAL_TASK_QUEUE=default-tenant-agent-queue
      - SANDBOX_MANAGER_URL=http://sandbox-manager:8082/api/v1/execute
      - SKILL_DISPATCHER_URL=http://skill-dispatcher:8085
      - SKILL_CATALOG_URL=http://skill-catalog:8087
      - TOOL_REGISTRY_URL=http://tool-registry:8086
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
      - BASH_EXECUTOR_URL=http://bash-executor:8092
      - AGENT_WORKSPACE=/tmp/agent-workspace
      - TOOL_API_PORT=8094
    depends_on:
      temporal:
        condition: service_started
      sandbox-manager:
        condition: service_started
      tool-registry:
        condition: service_started
      litellm:
        condition: service_healthy
    networks:
      - agent-net

  # ------------------------------------
  # Agent Workers (System)  (platform-system-agent-queue)
  # ------------------------------------
  agent-workers-system:
    build:
      context: ../../
      dockerfile: services/agent-workers/Dockerfile
    container_name: agent-workers-system
    restart: on-failure
    environment:
      - TEMPORAL_HOSTPORT=temporal:7233
      - LLM_GATEWAY_URL=http://litellm:4000/v1
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
      - MCP_REGISTRY_URL=http://mcp-registry:8090
      - KG_SERVICE_URL=http://kg-service:8093
      - EMBEDDING_MODEL=local-embedding
      - TEMPORAL_TASK_QUEUE=platform-system-agent-queue
      - SANDBOX_MANAGER_URL=http://sandbox-manager:8082/api/v1/execute
      - SKILL_DISPATCHER_URL=http://skill-dispatcher:8085
      - SKILL_CATALOG_URL=http://skill-catalog:8087
      - TOOL_REGISTRY_URL=http://tool-registry:8086
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
      - BEARTYPE_DOOR_DISABLE_CHECKER=1
      - BEARTYPE_ERROR_ON_NONFATAL_VIOLATION=0
    depends_on:
      temporal:
        condition: service_started
      sandbox-manager:
        condition: service_started
      tool-registry:
        condition: service_started
      litellm:
        condition: service_healthy
    networks:
      - agent-net

  # ------------------------------------
  # MCP Registry (port 8090) - MCP Client Hub
  # ------------------------------------
  mcp-registry:
    build:
      context: ../../
      dockerfile: services/mcp-registry/Dockerfile
    container_name: mcp-registry
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
      - PORT=8090
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-net

  # ------------------------------------
  # MCP Server (port 8091) - MCP Server Endpoint
  # ------------------------------------
  mcp-server:
    build:
      context: ../../
      dockerfile: services/mcp-server/Dockerfile
    container_name: mcp-server
    ports:
      - "8091:8091"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
      - SKILL_CATALOG_URL=http://skill-catalog:8087
      - SKILL_DISPATCHER_URL=http://skill-dispatcher:8085
      - PORT=8091
    depends_on:
      migrate:
        condition: service_completed_successfully
      skill-catalog:
        condition: service_started
      skill-dispatcher:
        condition: service_started
    networks:
      - agent-net

  # ------------------------------------
  # Admin API  (port 8089)
  # ------------------------------------
  admin-api:
    build:
      context: ../../
      dockerfile: services/admin-api/Dockerfile
    container_name: admin-api
    ports:
      - "8089:8089"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
      - ADMIN_API_KEY=dev-admin-key
      - TEMPORAL_HOSTPORT=temporal:7233
      - COOKBOOKS_DIR=/app/infra/platform/cookbooks
      - AGENT_REGISTRY_URL=http://agent-registry:8088
      - KG_SERVICE_URL=http://kg-service:8093
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-dev}
    volumes:
      - ../../infra/platform/cookbooks:/app/infra/platform/cookbooks:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      litellm:
        condition: service_healthy
    networks:
      - agent-net

  # ------------------------------------
  # System + Demo Seeder (runs once on every startup)
  #
  # Seeds idempotently (safe to re-run):
  #   • system tools & skills  → platform-system tenant (via admin-api)
  #   • system agents          → platform-system tenant (via agent-registry)
  #   • demo agents & KG       → default-tenant (via agent-registry + kg-service)
  #
  # Image: python:3.11-alpine + curl — needed because seed scripts use python3.
  # ------------------------------------
  seeder:
    image: python:3.11-alpine
    # No container_name — Docker creates a fresh container on every `docker compose up`
    # so seeding always re-runs (scripts are idempotent — safe to run repeatedly).
    restart: "no"
    volumes:
      - ./seed_system_tools.sh:/seed_system_tools.sh:ro
      - ./seed_system_skills.sh:/seed_system_skills.sh:ro
      - ./seed_system_agents.sh:/seed_system_agents.sh:ro
      - ./seed_demo_data.sh:/seed_demo_data.sh:ro
      - ../platform:/infra/platform:ro
    environment:
      - ADMIN_API_URL=http://admin-api:8089
      - ADMIN_API_KEY=dev-admin-key
      - AGENT_REGISTRY_URL=http://agent-registry:8088
      - KG_SERVICE_URL=http://kg-service:8093
    entrypoint:
      - sh
      - -c
      - |
        # Install runtime deps (cached in layer on repeated runs within the same compose up)
        pip install --quiet pyyaml requests 2>&1 | tail -1
        apk add --quiet curl bash 2>/dev/null || true

        echo "=== Seeder: waiting for admin-api ==="
        until curl -sf http://admin-api:8089/health > /dev/null 2>&1; do
          echo "  waiting for admin-api..."; sleep 3;
        done

        echo "=== Seeder: seeding system tools ==="
        TOOLS_YAML=/infra/platform/system-tools.yaml bash /seed_system_tools.sh || echo "  tools seed non-fatal error"

        echo "=== Seeder: seeding system skills ==="
        bash /seed_system_skills.sh || echo "  skills seed non-fatal error"

        echo "=== Seeder: seeding system agents ==="
        AGENTS_SOURCE=/infra/platform/system-agents bash /seed_system_agents.sh /infra/platform/system-agents || echo "  system agents seed non-fatal error"

        echo "=== Seeder: seeding demo data ==="
        bash /seed_demo_data.sh || echo "  demo data seed non-fatal error"

        echo "=== Seeder: all done ==="
    depends_on:
      admin-api:
        condition: service_started
      agent-registry:
        condition: service_started
      kg-service:
        condition: service_started
    networks:
      - agent-net

  # ------------------------------------
  # Admin Console  (port 3001)
  # ------------------------------------
  admin-console:
    build:
      context: ../../
      dockerfile: apps/admin-console/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8089
    container_name: admin-console
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_ADMIN_API_URL=http://localhost:8089
    depends_on:
      - admin-api
    networks:
      - agent-net

  # ------------------------------------
  # Agent Studio  (port 3000)
  # ------------------------------------
  agent-studio:
    build:
      context: ../../
      dockerfile: apps/agent-studio/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # For local test: browser reaches backends via published ports on the host.
        NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
        NEXT_PUBLIC_TOOL_REGISTRY_URL: http://localhost:8086
        NEXT_PUBLIC_SKILL_CATALOG_URL: http://localhost:8087
        NEXT_PUBLIC_AGENT_REGISTRY_URL: http://localhost:8088
        NEXT_PUBLIC_KG_SERVICE_URL: http://localhost:8093
        NEXT_PUBLIC_LLM_GATEWAY_URL: http://localhost:4000
        NEXT_PUBLIC_LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev}
        NEXT_PUBLIC_OLLAMA_URL: http://localhost:11434
        NEXT_PUBLIC_TENANT_ID: default-tenant
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8089
    container_name: agent-studio
    ports:
      - "3000:3000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8080
      - KG_SERVICE_URL=http://kg-service:8093
    depends_on:
      - api-gateway
      - tool-registry
      - skill-catalog
      - agent-registry
      - kg-service
    networks:
      - agent-net

  # ------------------------------------
  # SRE Dashboard  (port 8501)
  # ------------------------------------
  dashboard:
    build:
      context: ../../
      dockerfile: services/dashboard/Dockerfile
    container_name: dashboard
    ports:
      - "8501:8501"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8080
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/agentplatform?sslmode=disable
      - LLM_GATEWAY_URL=http://litellm:4000
    depends_on:
      - api-gateway
      - postgres
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  pg-data:
