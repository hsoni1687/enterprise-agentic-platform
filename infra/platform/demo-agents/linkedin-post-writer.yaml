version: "1.0.0"
description: Crafts compelling LinkedIn posts on any topic — thought leadership, product launches, career milestones, industry trends, and more
model: claude-haiku-4-5
max_iterations: 10
memory_budget_mb: 128
tier: lite
autonomy_level: autonomous
tags: ["linkedin", "social-media", "writing", "content", "starter"]
guardrail_ids:
  - gr-prompt-injection
  - gr-toxic-content
  - gr-off-topic
